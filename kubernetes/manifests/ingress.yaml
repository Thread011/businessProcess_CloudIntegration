apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loan-system-ingress
  namespace: loan-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: loan-system.local
    http:
      paths:
      - path: /loan-requests
        pathType: Prefix
        backend:
          service:
            name: loan-request-service
            port:
              number: 8000
      - path: /credit-check
        pathType: Prefix
        backend:
          service:
            name: credit-check-service
            port:
              number: 8000
      - path: /evaluations
        pathType: Prefix
        backend:
          service:
            name: property-evaluation-service
            port:
              number: 8000
      - path: /decisions
        pathType: Prefix
        backend:
          service:
            name: decision-service
            port:
              number: 8000
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8000
      - path: /dashboard
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8000
  - host: monitoring.loan-system.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
