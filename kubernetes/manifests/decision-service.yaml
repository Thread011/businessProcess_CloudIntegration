apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-service
  namespace: loan-system
  labels:
    app: decision-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: decision-service
  template:
    metadata:
      labels:
        app: decision-service
    spec:
      containers:
      - name: decision-service
        image: localhost/decision-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: loan-system-config
        - secretRef:
            name: loan-system-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: decision-service
  namespace: loan-system
spec:
  selector:
    app: decision-service
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
