apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-system-config
  namespace: loan-system
data:
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_VHOST: "/"
  REDIS_HOST: "redis"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: loan-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'loan-request-service'
        static_configs:
          - targets: ['loan-request-service:8000']
      
      - job_name: 'credit-check-service'
        static_configs:
          - targets: ['credit-check-service:8000']
      
      - job_name: 'property-evaluation-service'
        static_configs:
          - targets: ['property-evaluation-service:8000']
      
      - job_name: 'decision-service'
        static_configs:
          - targets: ['decision-service:8000']
      
      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service:8000']
