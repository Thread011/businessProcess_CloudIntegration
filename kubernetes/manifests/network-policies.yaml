apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: loan-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow ingress traffic to loan-request-service from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loan-request-service-ingress
  namespace: loan-system
spec:
  podSelector:
    matchLabels:
      app: loan-request-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
---
# Allow ingress traffic to credit-check-service from loan-request-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: credit-check-service-ingress
  namespace: loan-system
spec:
  podSelector:
    matchLabels:
      app: credit-check-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: loan-request-service
    - podSelector:
        matchLabels:
          app: celery-worker
    ports:
    - protocol: TCP
      port: 8000
---
# Allow ingress traffic to property-evaluation-service from loan-request-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: property-evaluation-service-ingress
  namespace: loan-system
spec:
  podSelector:
    matchLabels:
      app: property-evaluation-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: loan-request-service
    - podSelector:
        matchLabels:
          app: celery-worker
    ports:
    - protocol: TCP
      port: 8000
---
# Allow ingress traffic to decision-service from loan-request-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: decision-service-ingress
  namespace: loan-system
spec:
  podSelector:
    matchLabels:
      app: decision-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: loan-request-service
    - podSelector:
        matchLabels:
          app: celery-worker
    ports:
    - protocol: TCP
      port: 8000
---
# Allow ingress traffic to notification-service from all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service-ingress
  namespace: loan-system
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: loan-request-service
    - podSelector:
        matchLabels:
          app: credit-check-service
    - podSelector:
        matchLabels:
          app: property-evaluation-service
    - podSelector:
        matchLabels:
          app: decision-service
    - podSelector:
        matchLabels:
          app: celery-worker
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
---
# Allow egress traffic to RabbitMQ and Redis from all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infrastructure-egress
  namespace: loan-system
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: loan-system
